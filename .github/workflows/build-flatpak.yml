name: build-flatpak

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail
          version="$(grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' packaging/flatpak/io.github.easytier.EasyTierGUI.yml | head -n 1 | sed -E 's/^v|\.tar\.gz$//g')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Configure DNS (reduce EAI_AGAIN)
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -f /etc/resolv.conf
          printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\noptions timeout:2 attempts:3\n" | sudo tee /etc/resolv.conf
          cat /etc/resolv.conf

      - name: Prefer IPv4 (avoid ENETUNREACH on IPv6)
        shell: bash
        run: |
          set -euxo pipefail
          # Prefer IPv4 address selection in case IPv6 is present but unusable.
          echo "precedence ::ffff:0:0/96  100" | sudo tee -a /etc/gai.conf
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 net.ipv6.conf.default.disable_ipv6=1 || true

      - name: Work around npm registry DNS (hosts pin)
        shell: bash
        run: |
          set -euxo pipefail
          # Some runners intermittently fail DNS lookups for npm registries inside bubblewrap (EAI_AGAIN).
          # Pin the hostnames to known Anycast/Cloudflare IPs to bypass DNS.
          sudo tee -a /etc/hosts >/dev/null <<'EOF'
          104.16.0.34 registry.npmjs.org registry.yarnpkg.com
          104.16.1.34 registry.npmjs.org registry.yarnpkg.com
          104.16.2.34 registry.npmjs.org registry.yarnpkg.com
          104.16.3.34 registry.npmjs.org registry.yarnpkg.com
          EOF
          tail -n 20 /etc/hosts

      - name: Pin cargo hostnames (sandbox DNS workaround)
        shell: bash
        run: |
          set -euxo pipefail
          # cargo's git/registry fetches run inside the flatpak-builder sandbox,
          # where DNS intermittently fails ("failed to resolve address for
          # github.com: Temporary failure in name resolution"). Resolve on the
          # runner (host DNS works) and pin the current IPs in /etc/hosts,
          # which bubblewrap shares into the sandbox. Self-healing if the
          # Anycast IPs change.
          for h in github.com crates.io static.crates.io index.crates.io; do
            getent ahostsv4 "$h" \
              | awk '{print $1}' \
              | sort -u \
              | head -n 8 \
              | while read -r ip; do echo "${ip} ${h}"; done \
              | sudo tee -a /etc/hosts >/dev/null
          done
          tail -n 20 /etc/hosts

      - name: Install Flatpak tooling
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        shell: bash
        run: |
          set -euxo pipefail
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime + SDK
        shell: bash
        run: |
          set -euxo pipefail
          # GNOME SDK bundles WebKitGTK 4.1 (needed by the Tauri build); the
          # rust/node toolchains come from the freedesktop SDK extensions.
          sudo flatpak install -y flathub \
            org.gnome.Platform//47 \
            org.gnome.Sdk//47 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08 \
            org.freedesktop.Sdk.Extension.node20//24.08 \
            org.freedesktop.Sdk.Extension.llvm17//24.08

      - name: Restore flatpak-builder cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packaging/flatpak/.flatpak-builder/cache
          key: flatpak-builder-cache-${{ hashFiles('packaging/flatpak/io.github.easytier.EasyTierGUI.yml') }}
          restore-keys: |
            flatpak-builder-cache-

      - name: Restore pnpm store cache (Flatpak)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/pnpm-store-flatpak
          key: pnpm-store-flatpak-${{ steps.version.outputs.version }}-pnpm-9.15.4
          restore-keys: |
            pnpm-store-flatpak-${{ steps.version.outputs.version }}-
            pnpm-store-flatpak-

      - name: Prepare pnpm offline store (for Flatpak build)
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x packaging/flatpak/scripts/make-pnpm-store.sh
          mkdir -p .cache/pnpm-store-flatpak
          packaging/flatpak/scripts/make-pnpm-store.sh "${{ steps.version.outputs.version }}" packaging/flatpak/pnpm-store.tar.gz .cache/pnpm-store-flatpak

      - name: Restore cargo vendor cache (Flatpak)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/cargo-vendor-flatpak/rustup
            .cache/cargo-vendor-flatpak/cargo
          key: cargo-vendor-flatpak-${{ steps.version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-vendor-flatpak-${{ steps.version.outputs.version }}-

      - name: Prepare cargo vendor (for offline Flatpak build)
        shell: bash
        run: |
          set -euxo pipefail
          # flatpak-builder's build sandbox has no network (nor does Flathub),
          # so cargo deps must be vendored on the runner and shipped as a local
          # source, just like the pnpm store.
          chmod +x packaging/flatpak/scripts/make-cargo-vendor.sh
          mkdir -p .cache/cargo-vendor-flatpak
          packaging/flatpak/scripts/make-cargo-vendor.sh "${{ steps.version.outputs.version }}" packaging/flatpak/cargo-vendor.tar.gz .cache/cargo-vendor-flatpak

      - name: Build Flatpak (repo + bundle)
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh packaging/flatpak/pnpm-store.tar.gz packaging/flatpak/cargo-vendor.tar.gz
          ok=0
          for i in 1 2 3; do
            rm -rf packaging/flatpak/builddir packaging/flatpak/repo
            pushd packaging/flatpak
            if flatpak-builder --force-clean --repo=repo builddir io.github.easytier.EasyTierGUI.yml; then
              ok=1
              popd
              break
            fi
            popd
            echo "flatpak-builder failed (attempt $i), retrying..."
            sleep "$((i * 15))"
          done
          if [ "$ok" -ne 1 ]; then
            echo "flatpak-builder failed after retries"
            exit 1
          fi
          pushd packaging/flatpak
          flatpak build-bundle repo io.github.easytier.EasyTierGUI.flatpak io.github.easytier.EasyTierGUI \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          popd

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: easytier-gui-flatpak
          path: packaging/flatpak/io.github.easytier.EasyTierGUI.flatpak
